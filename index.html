            let searchQuery = '';

            const loading = document.getElementById('loading');

            const detailTitle = document.getElementById('detailTitle');
            const detailMeta = document.getElementById('detailMeta');

                    year: 'numeric', month: 'long', day: 'numeric'

                // 隐藏加载提示
                loading.style.display = 'none';

                // 过滤
                let filtered = allPosts.filter(post => {
                    const matchFilter = activeFilter === 'all' || post.tag === activeFilter;
                    const matchSearch = searchQuery === '' ||
                        post.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        post.excerpt.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        post.content.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchFilter && matchSearch;
                });

                if (filtered.length === 0) {
                    postsGrid.innerHTML = '';
                    noResults.style.display = 'block';
                    return;
                }

                noResults.style.display = 'none';
                postsGrid.innerHTML = filtered.map(post => {
                    // 构建卡片
                    return `
                        <div class="post-card" data-post-id="${post.id}">
                            <div class="post-card-body">
                                <div class="post-card-title">${escapeHtml(post.title)}</div>

                                </div>
                                <div class="post-card-excerpt">${escapeHtml(post.excerpt)}</div>
                            </div>

                                <span><i class="fas fa-arrow-right"></i></span>
                            </div>
                        </div>
                    `;
                }).join('');

                // 绑定卡片点击事件

                    card.addEventListener('click', (e) => {
                        const postId = Number(card.dataset.postId);
                        const post = allPosts.find(p => p.id === postId);
                        if (post) showDetail(post);
                    });
                });

            // 简单的 HTML 转义（防止 XSS 注入模拟内容）
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // 显示文章详情
            function showDetail(post) {
                detailTitle.textContent = post.title;

                // 构建 meta 区域
                detailMeta.innerHTML = `

                    <span><i class="far fa-calendar-alt"></i> ${post.date}</span>
                    <span><i class="far fa-user"></i> 红石块工作室</span>

            function closeDetail() {
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            // 事件绑定：关闭按钮、点击覆盖层背景关闭
            closeBtn.addEventListener('click', closeDetail);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    closeDetail();
                }
            });

            // ESC 键关闭
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlay.classList.contains('active')) {
                    closeDetail();
                }
            });

            // 导航过滤
            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    navLinks.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                    activeFilter = link.dataset.filter || 'all';
                    renderPosts();
                });
            });

            // 搜索
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim();
                renderPosts();
            });

            // 初始化
            function init() {
                setLastUpdate();
                // 模拟异步加载（延迟 300ms 让加载动画可见）
                loading.style.display = 'block';
                postsGrid.innerHTML = '';
                setTimeout(() => {
                    renderPosts();
                }, 200);
            }

            init();

            // 如果需要真实 API 替换，可以在这里改写 fetch 逻辑
            // 例如：
            // fetch('posts.json').then(res => res.json()).then(data => { allPosts = data; renderPosts(); })

        })();
    </script>
</body>
</html>
