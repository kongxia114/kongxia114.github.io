<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>红石块工作室 · 技术博客</title>
  <meta name="description" content="红石块工作室的技术博客：红石、Minecraft 模组、代码与折腾日常。内容以 GitHub Issues 撰写，同步发布在 GitHub Pages。">
  <meta name="theme-color" content="#c0392b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1d21" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="红石块工作室 · 技术博客">
  <meta property="og:description" content="红石、Minecraft 模组、代码与折腾日常，内容源为 GitHub Issues。">
  <meta property="og:site_name" content="红石块工作室">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="红石块工作室 RSS" href="data/feed.xml">
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- 尽早应用主题，避免深色模式下闪白 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('rs-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* 隐私模式下忽略 */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/" aria-label="返回首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32" role="img">
            <defs>
              <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff6b57"/>
                <stop offset="100%" stop-color="#b32b1b"/>
              </linearGradient>
            </defs>
            <path d="M16 2 30 9.5v13L16 30 2 22.5v-13z" fill="url(#rg)"/>
            <path d="M16 2 30 9.5 16 17 2 9.5z" fill="#ff8f7e" opacity=".85"/>
            <path d="M16 17v13L2 22.5v-13z" fill="#000" opacity=".14"/>
            <circle cx="16" cy="9.5" r="2.1" fill="#ffe6e0" opacity=".9"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">红石块工作室</span>
          <span class="brand-sub">Redstone Studio · 技术博客</span>
        </span>
      </a>

      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" type="button" title="切换主题" aria-label="切换主题">
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 2.4v2.6M12 19v2.6M2.4 12H5M19 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"
                  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M20 14.2A8.4 8.4 0 0 1 9.8 4a8.6 8.6 0 1 0 10.2 10.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
        <a class="btn btn-ghost" href="https://github.com/kongxia114/kongxia114.github.io/issues" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          <span>Issues</span>
        </a>
      </div>
    </div>
  </header>

  <nav class="toolbar" id="toolbar" aria-label="文章筛选">
    <div class="wrap toolbar-inner">
      <div class="chips" id="tagChips" role="group" aria-label="按标签筛选"></div>
      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M15.2 15.2 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索标题或正文…" autocomplete="off" spellcheck="false" aria-label="搜索文章">
        <kbd>/</kbd>
      </div>
    </div>
  </nav>

  <main id="main" class="wrap">

    <!-- ============ 列表视图 ============ -->
    <section id="listView">
      <div class="hero">
        <h1>把折腾写下来</h1>
        <p>红石、Minecraft 模组、代码与踩坑记录。文章直接写在 GitHub Issues 里，这里自动同步。</p>
        <div class="hero-stats" id="heroStats"></div>
      </div>

      <div id="loadingState" class="state" aria-live="polite">
        <div class="skeleton-grid" aria-hidden="true">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>
        <p class="state-text">正在加载文章…</p>
      </div>

      <div id="errorState" class="state" hidden>
        <p class="state-text">文章加载失败</p>
        <p class="state-hint" id="errorDetail"></p>
        <button class="btn btn-primary" type="button" id="retryBtn">重试</button>
        <p class="state-hint">
          也可以直接去
          <a href="https://github.com/kongxia114/kongxia114.github.io/issues" target="_blank" rel="noopener">GitHub Issues</a>
          查看原文
        </p>
      </div>

      <div id="emptyState" class="state" hidden>
        <p class="state-text">没有找到匹配的文章</p>
        <button class="btn btn-ghost" type="button" id="resetBtn">清除筛选</button>
      </div>

      <div class="posts-grid" id="postsGrid"></div>

      <div class="load-more-wrap">
        <button class="btn btn-ghost" type="button" id="loadMoreBtn" hidden>加载更多</button>
      </div>
    </section>

    <!-- ============ 文章视图 ============ -->
    <article id="postView" class="post-view" hidden>
      <a class="back-link" href="#/" id="backLink">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        返回列表
      </a>

      <header class="post-head">
        <div class="post-labels" id="postLabels"></div>
        <h1 class="post-title" id="postTitle"></h1>
        <div class="post-meta" id="postMeta"></div>
      </header>

      <details class="toc" id="postToc" hidden>
        <summary>目录</summary>
        <ol id="tocList"></ol>
      </details>

      <div class="post-content markdown-body" id="postContent"></div>

      <footer class="post-foot">
        <div class="post-actions">
          <a class="btn btn-primary" id="issueLink" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor">
              <path d="M1.5 2.75A.25.25 0 0 1 1.75 2.5h11.5a.25.25 0 0 1 .25.25v7.5a.25.25 0 0 1-.25.25H8.06l-2.8 2.8-.44.44V10.5H1.75a.25.25 0 0 1-.25-.25z"/>
            </svg>
            <span>去 Issues 评论</span>
          </a>
          <button class="btn btn-ghost" type="button" id="copyLinkBtn">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.1-1.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>复制链接</span>
          </button>
        </div>
        <nav class="post-nav" id="postNav" aria-label="相邻文章"></nav>
      </footer>

      <div class="reading-progress" aria-hidden="true"><div id="readingBar"></div></div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p class="footer-main">
        © <span id="year"></span> 红石块工作室 · 内容托管于
        <a href="https://github.com/kongxia114/kongxia114.github.io/issues" target="_blank" rel="noopener">GitHub Issues</a>
        · 由 GitHub Pages 提供
      </p>
      <p class="footer-sub">
        <span id="footUpdate">数据加载中…</span>
        · <a href="data/feed.xml">RSS</a>
        · <a href="https://github.com/kongxia114/kongxia114.github.io" target="_blank" rel="noopener">源码</a>
      </p>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭图片">&times;</button>
    <img id="lightboxImg" alt="">
  </div>

  <noscript>
    <p class="wrap" style="padding:1rem 0">本站需要 JavaScript 才能读取 GitHub Issues 数据。文章原文地址：
      <a href="https://github.com/kongxia114/kongxia114.github.io/issues">github.com/kongxia114/kongxia114.github.io/issues</a>
    </p>
  </noscript>

  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/purify.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
